<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Orcas Prime">
  <!--
    Orcas Prime mark. Replaces the default Astro logo that shipped with the
    scaffold and was still live in the browser tab.

    An orca's dorsal fin breaking a waterline — the one silhouette that stays
    readable at 16px, where any wordmark or detailed illustration turns to
    mush. Accent green on the paper cream, so it sits in the brand palette
    rather than next to it.
  -->
  <rect width="64" height="64" rx="14" fill="#2F4739"/>
  <!-- Dorsal fin: tall leading edge, swept trailing edge. -->
  <path d="M32.5 12c1.2 6.9 4.6 14.5 10.4 21.4H26.8C28.6 26.6 30.9 19.4 32.5 12Z" fill="#FAF7F2"/>
  <!-- Waterline, broken where the body sits. -->
  <path d="M12 39.5h16.4M35.6 39.5H52" stroke="#FAF7F2" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>
  <!-- Back of the body surfacing. -->
  <path d="M18 47.5c5.2-3.4 10.1-5.1 14-5.1s8.8 1.7 14 5.1" stroke="#FAF7F2" stroke-width="3.2" stroke-linecap="round" fill="none"/>
</svg>
