<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --paper:#FAF7F2; --ink:#1C1917; --ink-muted:#57534E;
    --ochre:#B45309; --ochre-hover:#92400E; --ochre-wash:#FDF0E1;
    --rule:#E7E1D8; --rule-strong:#D6CFC2;
  }
  body{
    width:1200px; height:630px; background:var(--paper); color:var(--ink);
    font-family:'Geist Sans',system-ui,sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px; -webkit-font-smoothing:antialiased;
  }
  .kicker{
    font-family:'Geist Mono',monospace; font-size:16px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-muted);
  }
  h1{
    font-family:'Fraunces',Georgia,serif; font-weight:500;
    font-size:74px; line-height:1.02; letter-spacing:-.028em; margin-top:26px;
    max-width:19ch;
  }
  .num{ font-family:'Geist Mono',monospace; font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .ochre{ color:var(--ochre); }
  .sub{ font-size:23px; color:var(--ink-muted); margin-top:24px; max-width:56ch; line-height:1.5; }
  footer{ display:flex; align-items:flex-end; justify-content:space-between; border-top:1px solid var(--rule-strong); padding-top:22px; }
  .wordmark{ font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:28px; }
  .meta{ font-family:'Geist Mono',monospace; font-size:15px; color:var(--ink-muted); letter-spacing:.04em; text-align:right; line-height:1.7; }
</style>
</head>
<body>
  <div>
    <div class="kicker">Ecommerce agency &middot; Jaipur, India</div>
    <h1>No retainer.<br />We take <span class="num ochre">3.5%</span> of what your customers actually keep.</h1>
    <p class="sub">Shopify stores built, launched and scaled &mdash; plus Amazon, Flipkart and Meesho. Nothing charged on returns or RTOs.</p>
  </div>
  <footer>
    <div class="wordmark">Orcas Prime</div>
    <div class="meta">
      <span class="num">3.5%</span> + GST of net sales<br />
      No lock-in &middot; No setup fees
    </div>
  </footer>
</body>
</html>
